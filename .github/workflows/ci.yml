name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: dbt build (models + data tests)
        run: uv run dental pipeline
      - name: Offline brief passes the fact-check
        run: uv run dental brief --offline
      - name: Unit and integration tests
        run: uv run pytest
